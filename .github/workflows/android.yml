name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Generate index.html for Capacitor
        run: |
          echo "=== Files inside .output/public ==="
          find .output/public

          JS_FILE=$(find .output/public -type f \( -name "*client*.js" -o -name "*index*.js" -o -name "*main*.js" \) | head -n 1 | sed 's|^\.output/public/||')
          if [ -z "$JS_FILE" ]; then
            JS_FILE=$(find .output/public -type f -name "*.js" | head -n 1 | sed 's|^\.output/public/||')
          end

          CSS_FILE=$(find .output/public -type f -name "*.css" | head -n 1 | sed 's|^\.output/public/||')

          echo "Injecting JS: $JS_FILE"
          echo "Injecting CSS: $CSS_FILE"

          if [ -z "$JS_FILE" ]; then
            echo "ERROR: No JavaScript file found!"
            exit 1
          fi

          cat <<EOF > .output/public/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Slate · Calm to-do</title>
              ${CSS_FILE:+<link rel="stylesheet" href="./$CSS_FILE" />}
              <link rel="manifest" href="./manifest.json" />
              <link rel="icon" href="./favicon.ico" />
            </head>
            <body>
              <script type="module" src="./$JS_FILE"></script>
            </body>
          </html>
          EOF

      - name: Set up JDK for Android
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Capacitor Android App
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk