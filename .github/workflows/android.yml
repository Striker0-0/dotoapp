name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Ensure index.html exists for Capacitor
        run: |
          # If TanStack generated a shell or another HTML file, map it to index.html
          if [ ! -f .output/public/index.html ]; then
            if [ -f .output/public/_shell.html ]; then
              cp .output/public/_shell.html .output/public/index.html
            else
              # Fallback: find any generated HTML file and copy it as index.html
              find .output/public -name "*.html" | head -n 1 | xargs -I {} cp {} .output/public/index.html
            fi
          fi

      - name: Set up JDK for Android
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Capacitor Android App
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk