name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Generate index.html for Capacitor
        run: |
          # Automatically find the hashed JS and CSS files generated by the build
          JS_FILE=$(find .output/public/assets -name "index-*.js" | head -n 1 | sed 's|.output/public/||')
          CSS_FILE=$(find .output/public/assets -name "styles-*.css" | head -n 1 | sed 's|.output/public/||')
          
          echo "Injecting JS: $JS_FILE"
          echo "Injecting CSS: $CSS_FILE"

          # Dynamically create index.html with the correct file references
          cat <<EOF > .output/public/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>All Tasks · Slate</title>
              <link rel="stylesheet" href="./$CSS_FILE" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="./$JS_FILE"></script>
            </body>
          </html>
          EOF

      - name: Set up JDK for Android
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Capacitor Android App
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk